<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang Thử Nghiệm Âm Thanh & Media - OmniLoader</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    .container {
      max-width: 600px;
      width: 100%;
      background: #1e293b;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 20px;
      margin-bottom: 8px;
      color: #38bdf8;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .track-card {
      background: #334155;
      padding: 16px;
      border-radius: 10px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .track-title {
      font-weight: 600;
      color: #f1f5f9;
    }
    audio {
      width: 100%;
    }
    .badge {
      background: #0284c7;
      color: white;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      width: fit-content;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎵 Trang Test Âm Thanh cho OmniLoader</h1>
    <p>Bấm nút Play (Phát) ở bất kỳ bài nào dưới đây, sau đó bấm vào icon extension OmniLoader trên thanh công cụ để thử tải:</p>

    <div class="track-card">
      <span class="badge">MP3 Audio 1</span>
      <div class="track-title">Sound Sample: Classical Piano</div>
      <audio controls src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>
    </div>

    <div class="track-card">
      <span class="badge">MP3 Audio 2</span>
      <div class="track-title">Sound Sample: Upbeat Electronic</div>
      <audio controls src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"></audio>
    </div>

    <div class="track-card">
      <span class="badge">MP3 Audio 3</span>
      <div class="track-title">Sound Sample: Guitar Melody</div>
      <audio controls src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"></audio>
    </div>
  </div>
</body>
</html>
