<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang Thử Nghiệm Âm Thanh & Video - OmniLoader</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    .container {
      max-width: 620px;
      width: 100%;
      background: #1e293b;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 20px;
      margin-bottom: 8px;
      color: #38bdf8;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .track-card {
      background: #334155;
      padding: 16px;
      border-radius: 10px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .track-title {
      font-weight: 600;
      color: #f1f5f9;
    }
    audio, video {
      width: 100%;
      border-radius: 6px;
    }
    .badge {
      background: #0284c7;
      color: white;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      width: fit-content;
    }
    .badge-video {
      background: #6366f1;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎵 Trang Test Âm Thanh & Tách MP3 Video</h1>
    <p>Bấm phát thử âm thanh hoặc video bên dưới, rồi bấm vào icon <b>OmniLoader</b>:</p>

    <!-- Video Test (Thử tách MP3) -->
    <div class="track-card">
      <span class="badge badge-video">VIDEO CLIPP (Test Tách Lấy MP3)</span>
      <div class="track-title">Sample Clip: Big Buck Bunny (MP4 Video)</div>
      <video controls src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4"></video>
    </div>

    <!-- Audio Test 1 -->
    <div class="track-card">
      <span class="badge">MP3 Audio 1</span>
      <div class="track-title">Sound Sample: Classical Piano</div>
      <audio controls src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>
    </div>

    <!-- Audio Test 2 -->
    <div class="track-card">
      <span class="badge">MP3 Audio 2</span>
      <div class="track-title">Sound Sample: Upbeat Electronic</div>
      <audio controls src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"></audio>
    </div>
  </div>
</body>
</html>
