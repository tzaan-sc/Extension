<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tài Liệu Mẫu: Giáo Trình Nhập Môn Lập Trình</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .header-box {
      max-width: 700px;
      width: 100%;
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
    }
    h1 {
      font-size: 20px;
      color: #38bdf8;
      margin-bottom: 6px;
    }
    p {
      font-size: 13px;
      color: #94a3b8;
    }
    .document-viewer {
      max-width: 700px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 24px;
      align-items: center;
    }
    .page-wrapper {
      background: white;
      color: #1e293b;
      width: 100%;
      max-width: 600px;
      height: 750px;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    canvas {
      width: 100%;
      height: 100%;
    }
    .page-tag {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.6);
      color: white;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <div class="header-box">
    <h1>📚 Trang Thử Nghiệm Tải Tài Liệu Học Tập (Canvas / PDF)</h1>
    <p>Trang này mô phỏng các website học liệu chặn tải bằng thẻ Canvas (như Scribd, Studocu, Canvas LMS).</p>
    <p style="color: #34d399; margin-top: 6px;">👉 Hãy mở <b>OmniLoader</b> và bấm nút <b>"Tải tài liệu"</b> hoặc tab <b>Tài liệu</b> để thử tạo file PDF!</p>
  </div>

  <div class="document-viewer">
    <div class="page-wrapper">
      <span class="page-tag">Trang 1</span>
      <canvas id="page1" width="600" height="750"></canvas>
    </div>

    <div class="page-wrapper">
      <span class="page-tag">Trang 2</span>
      <canvas id="page2" width="600" height="750"></canvas>
    </div>

    <div class="page-wrapper">
      <span class="page-tag">Trang 3</span>
      <canvas id="page3" width="600" height="750"></canvas>
    </div>
  </div>

  <script>
    // Vẽ nội dung giả lập từng trang tài liệu lên Canvas
    function drawPage(canvasId, title, pageNum, contentLines) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');

      // Nền trắng
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Viền trang
      ctx.strokeStyle = '#e2e8f0';
      ctx.lineWidth = 4;
      ctx.strokeRect(10, 10, canvas.width - 20, canvas.height - 20);

      // Tiêu đề
      ctx.fillStyle = '#0f172a';
      ctx.font = 'bold 22px system-ui';
      ctx.fillText(title, 40, 60);

      // Đường kẻ ngang
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(40, 75);
      ctx.lineTo(560, 75);
      ctx.stroke();

      // Nội dung bài học
      ctx.fillStyle = '#334155';
      ctx.font = '15px system-ui';
      let y = 120;
      contentLines.forEach(line => {
        ctx.fillText(line, 40, y);
        y += 28;
      });

      // Số trang cuối
      ctx.fillStyle = '#94a3b8';
      ctx.font = '13px system-ui';
      ctx.fillText(`- Trang ${pageNum} / 3 -`, canvas.width / 2 - 40, canvas.height - 30);
    }

    drawPage('page1', 'Chương 1: Tổng Quan Lập Trình', 1, [
      '1. Khái niệm cơ bản về lập trình máy tính.',
      '2. Các ngôn ngữ phổ biến: JavaScript, Python, C++.',
      '3. Cấu trúc dữ liệu và giải thuật căn bản.',
      '4. Môi trường phát triển IDE và trình biên dịch.',
      '5. Quy trình xây dựng phần mềm chuẩn quốc tế.'
    ]);

    drawPage('page2', 'Chương 2: Cú Pháp & Kiểu Dữ Liệu', 2, [
      '1. Khai báo biến: var, let, const.',
      '2. Kiểu dữ liệu nguyên thủy: Number, String, Boolean.',
      '3. Kiểu đối tượng: Object, Array, Set, Map.',
      '4. Các phép toán số học và logic.',
      '5. Điều kiện rẽ nhánh: if-else và switch-case.'
    ]);

    drawPage('page3', 'Chương 3: Xây Dựng Dự Án Thực Tế', 3, [
      '1. Phân tích yêu cầu và thiết kế giao diện.',
      '2. Viết mã xử lý logic và kết nối API.',
      '3. Kiểm thử tự động (Unit Test & Integration Test).',
      '4. Đóng gói sản phẩm và xuất bản lên kho ứng dụng.',
      '5. Bảo trì và nâng cấp tính năng định kỳ.'
    ]);
  </script>
</body>
</html>
