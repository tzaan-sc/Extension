<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniLoader</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
        </div>
        <div class="brand-text">
          <h1>OmniLoader</h1>
          <span class="version-tag">Audio & Media Pro</span>
        </div>
      </div>

      <div class="header-actions">
        <button id="btnRefresh" class="icon-btn" title="Quét lại trang hiện tại">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Page Info Badge -->
    <div class="page-meta">
      <span class="meta-label">Tab:</span>
      <span id="pageTitle" class="meta-title" title="...">Đang kết nối...</span>
    </div>

    <!-- Filter Tabs -->
    <nav class="filter-tabs">
      <button class="tab-btn" data-category="audio">
        🎵 Âm thanh <span id="countAudio" class="tab-count">0</span>
      </button>
      <button class="tab-btn active" data-category="all">
        Tất cả <span id="countAll" class="tab-count">0</span>
      </button>
      <button class="tab-btn" data-category="video">
        Video <span id="countVideo" class="tab-count">0</span>
      </button>
      <button class="tab-btn" data-category="document">
        Tài liệu <span id="countDoc" class="tab-count">0</span>
      </button>
    </nav>

    <!-- Quick Tool Banners -->
    <div class="quick-tools">
      <button id="btnScanAudio" class="tool-btn highlight" title="Quét sâu tất cả file nhạc/âm thanh trên trang">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 18V5l12-2v13"></path>
          <circle cx="6" cy="18" r="3"></circle>
          <circle cx="18" cy="16" r="3"></circle>
        </svg>
        <span>Quét tìm Âm thanh</span>
      </button>
      <button id="btnScanCanvas" class="tool-btn" title="Quét tài liệu học tập PDF/Canvas">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
        </svg>
        <span>Tải tài liệu</span>
      </button>
    </div>

    <!-- Media List -->
    <main class="media-container" id="mediaContainer">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M9 18V5l12-2v13"></path>
            <circle cx="6" cy="18" r="3"></circle>
            <circle cx="18" cy="16" r="3"></circle>
          </svg>
        </div>
        <h3>Chưa bắt được file âm thanh / media</h3>
        <p>Bấm nút <b>"Quét tìm Âm thanh"</b> ở trên hoặc bấm phát âm thanh/video trên trang web để extension bắt link tự động.</p>
      </div>
    </main>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
