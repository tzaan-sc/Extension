<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniLoader</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
        </div>
        <div class="brand-text">
          <h1>OmniLoader</h1>
          <span class="version-tag">All-In-One Downloader</span>
        </div>
      </div>

      <div class="header-actions">
        <button id="btnRefresh" class="icon-btn" title="Quét lại trang">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Page Info Badge -->
    <div class="page-meta">
      <span class="meta-label">Trang:</span>
      <span id="pageTitle" class="meta-title" title="...">Đang nạp...</span>
    </div>

    <!-- Filter Tabs (Tách biệt hoàn toàn từng chuyên mục) -->
    <nav class="filter-tabs">
      <button class="tab-btn active" data-category="all">
        Tất cả <span id="countAll" class="tab-count">0</span>
      </button>
      <button class="tab-btn" data-category="audio">
        🎵 Âm thanh <span id="countAudio" class="tab-count">0</span>
      </button>
      <button class="tab-btn" data-category="video">
        🎬 Video <span id="countVideo" class="tab-count">0</span>
      </button>
      <button class="tab-btn" data-category="document">
        📚 Tài liệu <span id="countDoc" class="tab-count">0</span>
      </button>
    </nav>

    <!-- Main Container -->
    <main class="media-container" id="mediaContainer">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
        </div>
        <h3>Chưa tìm thấy mục nào</h3>
        <p>Bấm phát âm thanh / video hoặc cuộn trang để bắt link tự động.</p>
      </div>
    </main>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
