<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OmniLoader</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
        </div>
        <div class="brand-text">
          <h1>OmniLoader</h1>
          <span class="version-tag">Pro Downloader</span>
        </div>
      </div>

      <div class="header-actions">
        <button id="btnRefresh" class="icon-btn" title="Quét lại trang hiện tại">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Page Info Badge -->
    <div class="page-meta">
      <span class="meta-label">Tab:</span>
      <span id="pageTitle" class="meta-title" title="...">Đang kết nối...</span>
    </div>

    <!-- Filter Tabs -->
    <nav class="filter-tabs">
      <button class="tab-btn active" data-category="all">
        Tất cả <span id="countAll" class="tab-count">0</span>
      </button>
      <button class="tab-btn" data-category="video">
        Video <span id="countVideo" class="tab-count">0</span>
      </button>
      <button class="tab-btn" data-category="audio">
        Âm thanh <span id="countAudio" class="tab-count">0</span>
      </button>
      <button class="tab-btn" data-category="document">
        Tài liệu <span id="countDoc" class="tab-count">0</span>
      </button>
    </nav>

    <!-- Quick Tool Banners -->
    <div class="quick-tools">
      <button id="btnUnblurDoc" class="tool-btn highlight" title="Xóa mờ văn bản, gỡ popup chặn đăng nhập và mở khóa xem toàn bộ tài liệu">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
        </svg>
        <span>🔓 Mở mờ & Tải Full</span>
      </button>
      <button id="btnScanCanvas" class="tool-btn" title="Quét toàn bộ trang Canvas/PDF và xuất file">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
        </svg>
        <span>Xuất File PDF</span>
      </button>
    </div>

    <!-- Media List -->
    <main class="media-container" id="mediaContainer">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
        </div>
        <h3>Chưa tìm thấy Media</h3>
        <p>Bấm phát video, cuộn trang hoặc bấm nút <b>"Xuất File PDF"</b> để tải tài liệu.</p>
      </div>
    </main>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
